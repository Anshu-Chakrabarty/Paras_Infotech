<style>

.tools input[type=search],.card input[type=search],select.role{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid #c9d1da;border-radius:4px;padding:8px 10px}

.who{margin-top:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden}

.rolebox{margin-top:12px;display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:14px;align-items:start}
@media (max-width:760px){.rolebox{grid-template-columns:1fr}}
.rolebox select{width:100%}
.desc{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--bg)}
.desc b{display:block;margin-bottom:4px}
.desc p{margin:0 0 8px;color:var(--soft);font-size:14.5px}
.desc ul{margin:0;padding-left:18px;font-size:14.5px}
.legend{margin:0 0 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.legend summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy)}
.legend .in{padding:0 14px 14px;display:grid;gap:10px}
.legend .one{border-top:1px solid var(--line);padding-top:10px}
.legend .one b{display:block}
.legend .one p{margin:4px 0;color:var(--soft);font-size:14px}
.bar{position:fixed;z-index:30;left:268px;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 32px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(11,20,32,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal.show{display:flex}
.dlg{background:var(--card);color:var(--ink);border-radius:8px;max-width:900px;width:100%;max-height:86vh;display:flex;flex-direction:column;border-top:6px solid #0b2e4a}
.dlg h3{margin:0;padding:18px 22px 6px;font-size:20px}
.dlg .sub{padding:0 22px 12px;color:var(--soft);font-size:15px}
.dlg .body{overflow:auto;padding:0 22px 10px;border-top:1px solid var(--line)}
table.grid{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
table.grid th,table.grid td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.grid th{background:var(--bg)}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.done-msg{background:var(--okbg);color:var(--ok);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0}
.done-msg.warn{background:var(--warnbg);color:var(--warn)}
.empty{color:var(--soft);padding:18px 4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2f6aa3;outline-offset:2px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.bar{left:0}.wrap{padding:22px 16px 140px}}
</style></head>
<body>
<div class="app">
<aside>
  <div class="brand">MAKEEN ENERGY</div>
  <div class="sub">Facility Management · KEKA designation to role</div>
  <nav>
    <a href="#step1" id="nav1" class="on"><span>1. Who gets a login</span><span class="cnt" id="c1">0/0</span></a>
    <a href="#step2" id="nav2"><span>2. Map to a role</span><span class="cnt" id="c2">0/0</span></a>
  </nav>
  <a class="out" href="/Access-Management-Facility_Management-Makeen_Energy/">Access Management</a>
</aside>
<div class="main">
<header class="top"><span class="t">MAKEEN Energy India</span><span class="right" id="progress"></span></header>
<div class="wrap">
<h1>KEKA designation to portal role</h1>
<p class="intro" id="intro"></p>
<div class="steps"><span id="pill1" class="on">1. Who gets a Facility login</span><span id="pill2">2. Map those designations to a role</span></div>
<div id="doneBox"></div>
<div id="step1"></div>
<div id="step2" hidden></div>
</div></div></div>
<div class="bar"><div class="in"><span id="progress2" style="font-size:14px;color:var(--soft)"></span><span style="display:flex;gap:10px;flex-wrap:wrap">
<button class="btn ghost" id="dl" hidden>Download answers</button>
<button class="btn ghost" id="back2" hidden>Back to who gets a login</button>

<script>
const ROLES=[
 {id:"Admin",desc:"Runs People, this map, plant create, and the tight actions.",access:["Search, Submit, Download and Approve on every Facility module","People, this designation map, and notification control","Deletes a plant, reopens an approved row, or replaces a file after Approve"]},
 {id:"Plant Manager",desc:"Owns the plant. Approves Daily / Monthly. Does not type the daily form.",access:["Search, Download, Approve","Submit on Plant master details, Audit and Licences","Approve or Return Daily MIS and Monthly MIS"]},
 {id:"Dy Plant Incharge",desc:"Types Daily / Monthly / Exception for the plant.",access:["Search","Submit on Daily MIS, Daily Exception, and the month-only fields on Monthly MIS"]},
 {id:"Maintenance Officer",desc:"Types Daily / Monthly / Exception.",access:["Search","Submit on Daily MIS, Daily Exception, and the month-only fields on Monthly MIS"]},
 {id:"Operation Officer",desc:"Types Daily / Monthly / Exception.",access:["Search","Submit on Daily MIS, Daily Exception, and the month-only fields on Monthly MIS"]},
 {id:"Sr. Operations and Maintenance Officer",desc:"Types Daily / Monthly / Exception.",access:["Search","Submit on Daily MIS, Daily Exception, and the month-only fields on Monthly MIS"]},
 {id:"Accounts Officer",desc:"Accounts work on this portal. Not plant typing.",access:["Search and Download"]},
 {id:"Asst Manager HSSE",desc:"Safety / HSSE. Types Exception. Not Daily MIS typing.",access:["Search, Download","Submit on Daily Exception and Audit"]},
 {id:"Safety Officer",desc:"Types Exception. Receives safety notices.",access:["Search, Download","Submit on Daily Exception and Audit"]},
 {id:"QHSE Head",desc:"QHSE view. Not daily plant typing unless you later tick it on Access Management.",access:["Search and Download"]},
 {id:"FM Co-ordinator",desc:"FM office / Head - FM Operations.",access:["Search and Download"]},
 {id:"Zonal Manager",desc:"More than one plant (Incharge East / South / West, Manager-North).",access:["Search and Download"]},
 {id:"Management",desc:"Directors / GM / finance head. Open and download, not daily typing.",access:["Search and Download"]},
 {id:"Staff",desc:"Plant floor (Technician, Operator, Supervisor). Search only unless you tick more on Access Management.",access:["Search only"]}
];
const ROLEMAP=Object.fromEntries(ROLES.map(r=>[r.id,r]));
function suggestedRole(d){
 const s=String(d||"").toLowerCase().replace(/\s+/g," ").trim();
 if(/head - fm|compliance manager-fm/.test(s))return "FM Co-ordinator";
 if(/head qhse|qhse manager/.test(s))return "QHSE Head";
 if(/asst manager - hsse/.test(s))return "Asst Manager HSSE";
 if(/safety/.test(s))return "Safety Officer";
 if(/sr\.? ?plant manager|plant manager/.test(s))return "Plant Manager";
 if(/plant incharge/.test(s))return "Dy Plant Incharge";
 if(/sr\.? operations\s*(&|and)\s*maintenance/.test(s))return "Sr. Operations and Maintenance Officer";
 if(/maintainence officer|maintenance officer|asst\.? maintenance|electrical maintenance/.test(s))return "Maintenance Officer";
 if(/operartions officer|operations officer|operation officer|operations executive|trainee operation/.test(s))return "Operation Officer";
 if(/accounts/.test(s))return "Accounts Officer";
 if(/incharge (south|west|east)|manager-north|regional manager|zonal|mult manager/.test(s))return "Zonal Manager";
 if(/admin executive|admin assistant/.test(s))return "Admin";
 if(/cfo|finance controller/.test(s))return "Management";
 if(/sales|marcom|graphic|content writer|erp consultant|piping|stress engineer|layout engineer|material engineer|hr executive|hr officer|hr &admin|people & culture|legal, csr|order processing|taxation|purchase manager|scm|supply chain/.test(s))return "No FM login";
 if(/director|general manager/.test(s))return "Management";
 if(/technician|operator|supervisor|electrician|stores|clerk|field engineer|service engineer|packing|control room|dpt supervisor|team lead|trainee/.test(s))return "Staff";
 return "";
}
function oftenNoLogin(d){return suggestedRole(d)==="No FM login"}
const SAVE_URL="/api/fm-role-map";
const KEY="fm-role-map-draft-v1";
const PEOPLE_URL="/KEKA-Role-Map-Facility_Management-Makeen_Energy/people.json";
let DES=[];
const state={};
const cards={};
let step=1;
let ready=false;
let saveTimer=null;
let filter="all";
let qfind="";
const norm=s=>s.toLowerCase().replace(/\s+/g," ").trim();
function el(t,a={},...c){const n=document.createElement(t);for(const k in a){if(k==="class")n.className=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]===false||a[k]==null){}else if(a[k]===true)n.setAttribute(k,"");else n.setAttribute(k,a[k])}c.flat().forEach(x=>{if(x!=null)n.append(x)});return n}
function status(t){const n=document.getElementById("progress2");if(n)n.textContent=t||""}
function peopleOf(d){return d.people.filter(p=>!(state[d.key].drop||[]).includes(String(p[0])))}
function yesList(){return DES.filter(d=>state[d.key].access==="yes")}
function packDraft(){
 const draft={};
 DES.forEach(d=>{const s=state[d.key];draft[d.key]={access:s.access,drop:[...(s.drop||[])],role:s.role||""}});
 return draft;
}
function applyDraft(draft){
 if(!draft||typeof draft!=="object")return;
 DES.forEach(d=>{
  const row=draft[d.key];if(!row)return;
  if(row.access==="yes"||row.access==="no")state[d.key].access=row.access;
  state[d.key].drop=Array.isArray(row.drop)?row.drop.map(String):[];
  if(typeof row.role==="string")state[d.key].role=row.role;
 });
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({savedAt:Date.now(),draft:packDraft()}))}catch(e){}}
function persistNow(){
 if(!ready)return;
 status("Saving…");
 saveLocal();
 fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({draft:packDraft()})})
  .then(r=>{if(!r.ok)throw new Error("save");return r.json()})
  .then(()=>status(""))
  .catch(()=>status("Could not save. Kept on this device."));
}
function saveDraft(){saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(persistNow,400)}
function answers(){
 return DES.map(d=>{
  const s=state[d.key];
  const dropped=(s.drop||[]).map(n=>d.people.find(p=>String(p[0])===String(n))).filter(Boolean).map(p=>({employeeNumber:p[0],name:p[1],location:p[3]}));
  const people=s.access==="yes"?peopleOf(d).map(p=>({employeeNumber:p[0],name:p[1],location:p[3]})):[];
  return {designation:d.label,peopleCount:d.people.length,access:s.access||"not decided",dropped,role:s.access==="yes"?(s.role||""):"No FM login",people};
 });
}
function csv(){
 const rows=[["KEKA designation","People in KEKA","Facility login","Dropped","Portal role","People who get login"]];
 answers().forEach(a=>rows.push([a.designation,a.peopleCount,a.access,a.dropped.map(x=>x.name).join("; "),a.role,a.people.map(x=>x.name+" ("+(x.location||"")+")").join("; ")]));
 return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
}
function download(){const url=URL.createObjectURL(new Blob([csv()],{type:"text/csv"}));const a=el("a",{href:url,download:"keka-designation-to-role-map.csv"});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function roleCard(id){
 if(!id||!ROLEMAP[id])return el("div",{class:"desc"},el("p",{},"Pick a portal role. The description and access for that role will show here."));
 const r=ROLEMAP[id];
 return el("div",{class:"desc"},el("b",{},r.id),el("p",{},r.desc),el("div",{},"Access this role is given:"),el("ul",{},...r.access.map(x=>el("li",{},x))));
}
function setAccess(d,v){
 state[d.key].access=v;
 if(v==="no")state[d.key].role="";
 else if(!state[d.key].role){const sug=suggestedRole(d.label);if(sug&&sug!=="No FM login")state[d.key].role=sug}
 paint();saveDraft();
}
function togglePerson(d,num,on){
 const drop=state[d.key].drop||[];
 const i=drop.indexOf(String(num));
 if(!on&&i<0)drop.push(String(num));
 if(on&&i>=0)drop.splice(i,1);
 state[d.key].drop=drop;
 saveDraft();progress();
}
function nameTable(d,opts){
 const allowDrop=!!opts.allowDrop;
 const find=el("input",{type:"search",placeholder:"Find a name"});
 const count=el("span",{});
 const tbody=el("tbody",{});
 const box=el("div",{class:"who"},el("div",{class:"bar2"},count,find),el("div",{class:"scroll"},el("table",{},el("thead",{},el("tr",{},allowDrop?el("th",{},""):null,el("th",{},"Name"),el("th",{},"Location"),el("th",{},"Code"))),tbody)));
 function draw(){
  const f=norm(find.value);tbody.innerHTML="";
  const rows=d.people.filter(p=>!f||norm(p[1]+" "+(p[3]||"")+p[0]).includes(f));
  rows.forEach(p=>{
   const on=!(state[d.key].drop||[]).includes(String(p[0]));
   const tr=el("tr",{class:allowDrop&&!on?"off":""});
   if(allowDrop){
    const cb=el("input",{type:"checkbox"});cb.checked=on;
    cb.addEventListener("change",()=>{togglePerson(d,p[0],cb.checked);tr.classList.toggle("off",!cb.checked);draw()});
    tr.append(el("td",{},cb));
   }
   tr.append(el("td",{},p[1]),el("td",{},p[3]||"—"),el("td",{},p[0]||"—"));
   tbody.append(tr);
  });
  const kept=peopleOf(d).length;
  count.textContent=d.people.length+" "+(d.people.length===1?"person":"people")+" in KEKA"+(allowDrop?" · "+kept+" will get a login":"");
  if(!rows.length)tbody.append(el("tr",{},el("td",{colspan:allowDrop?"4":"3"},"No name matches.")));
 }
 find.addEventListener("input",draw);draw();
 return box;
}
function desCard(d){
 const s=state[d.key];
 const card=el("div",{class:"card"+(s.access==="yes"?" yes":s.access==="no"?" no":"")});
 const left=el("div",{},el("div",{class:"ttl"},d.label),el("div",{class:"meta"},d.people.length+" "+(d.people.length===1?"person":"people")+" in this KEKA designation"));
 if(oftenNoLogin(d.label)&&s.access!=="yes")left.append(el("div",{class:"hint"},"Often no Facility login (sales / HR / piping / SCM). Confirm."));
 const yes=el("button",{class:"btn yes"+(s.access==="yes"?" on":""),type:"button",onclick:()=>setAccess(d,"yes")},"Needs Facility login");
 const no=el("button",{class:"btn no"+(s.access==="no"?" on":""),type:"button",onclick:()=>setAccess(d,"no")},"No Facility login");
 card.append(el("div",{class:"hd"},left,el("div",{class:"choice"},yes,no)));
 card.append(nameTable(d,{allowDrop:s.access==="yes"}));
 return card;
}
function roleRow(d){
 const s=state[d.key];
 const card=el("div",{class:"card yes"});
 card.append(el("div",{class:"ttl"},d.label),el("div",{class:"meta"},peopleOf(d).length+" of "+d.people.length+" people will get this role"));
 const sel=el("select",{class:"role","aria-label":"Portal role for "+d.label});
 sel.append(el("option",{value:""},"Select a portal role"));
 ROLES.forEach(r=>sel.append(el("option",{value:r.id},r.id)));
 sel.value=s.role||"";
 const panel=el("div",{});
 function show(){panel.innerHTML="";panel.append(roleCard(sel.value))}
 sel.addEventListener("change",()=>{state[d.key].role=sel.value;show();progress();saveDraft()});
 show();
 card.append(el("div",{class:"rolebox"},sel,panel));
 card.append(nameTable(d,{allowDrop:true}));
 return card;
}
function visibleDes(){
 const f=norm(qfind);
 return DES.filter(d=>{
  if(filter==="yes"&&state[d.key].access!=="yes")return false;
  if(filter==="no"&&state[d.key].access!=="no")return false;
  if(filter==="open"&&state[d.key].access)return false;
  if(!f)return true;
  if(norm(d.label).includes(f))return true;
  return d.people.some(p=>norm(p[1]+" "+(p[3]||"")).includes(f));
 });
}
function paintStep1(){
 const box=document.getElementById("step1");box.innerHTML="";
 const tools=el("div",{class:"tools"});
 const search=el("input",{type:"search",placeholder:"Search designation or person"});search.value=qfind;
 search.addEventListener("input",()=>{qfind=search.value;paintStep1()});
 const seg=el("div",{class:"seg"});
 [["all","All"],["open","Not decided"],["yes","Needs login"],["no","No login"]].forEach(([id,lab])=>{
  const b=el("button",{type:"button",class:filter===id?"on":"",onclick:()=>{filter=id;paintStep1()}},lab);
  seg.append(b);
 });
 tools.append(search,seg);box.append(tools);
 const list=visibleDes();
 if(!list.length)box.append(el("div",{class:"empty"},"No designation matches that filter."));
 list.forEach(d=>box.append(desCard(d)));
}
function paintStep2(){
 const box=document.getElementById("step2");box.innerHTML="";
 const yes=yesList();
 const legend=el("details",{class:"legend"},el("summary",{},"What each portal role can do"),el("div",{class:"in"},
  ...ROLES.map(r=>el("div",{class:"one"},el("b",{},r.id),el("p",{},r.desc),el("ul",{},...r.access.map(x=>el("li",{},x)))))));
 box.append(legend);
 if(!yes.length){box.append(el("div",{class:"empty"},"No designation is marked “Needs Facility login” yet. Go back and mark who should sign in."));return}
 yes.forEach(d=>box.append(roleRow(d)));
}
function progress(){
 const decided=DES.filter(d=>state[d.key].access).length;
 const yes=yesList();
 const mapped=yes.filter(d=>state[d.key].role).length;
 document.getElementById("c1").textContent=decided+"/"+DES.length;
 document.getElementById("c2").textContent=mapped+"/"+yes.length;
 document.getElementById("nav1").classList.toggle("full",decided===DES.length&&DES.length>0);
 document.getElementById("nav2").classList.toggle("full",yes.length>0&&mapped===yes.length);
 document.getElementById("progress").textContent=step===1?(decided+" of "+DES.length+" designations decided"):(mapped+" of "+yes.length+" designations have a role");
 const nPeople=yes.reduce((n,d)=>n+peopleOf(d).length,0);
 document.getElementById("to2").textContent="Continue to map roles ("+yes.length+" designation"+(yes.length===1?"":"s")+", "+nPeople+" people)";
 document.getElementById("to2").disabled=yes.length===0&&step===1;
}
function showStep(n){
 step=n;
 document.getElementById("step1").hidden=n!==1;
 document.getElementById("step2").hidden=n!==2;
 document.getElementById("pill1").classList.toggle("on",n===1);
 document.getElementById("pill2").classList.toggle("on",n===2);
 document.getElementById("nav1").classList.toggle("on",n===1);
 document.getElementById("nav2").classList.toggle("on",n===2);
 document.getElementById("to2").hidden=n!==1;
 document.getElementById("back2").hidden=n!==2;
 document.getElementById("review").hidden=n!==2;
 document.getElementById("intro").textContent=n===1
  ?"First decide which KEKA designations need a login to Facility Management. Names are listed so you can see who they are. Uncheck a name if that person should not get a login. Designations marked No login drop off the next step."
  :"These are the designations that need a Facility login. Pick the portal role for each one. The description and access for that role appear next to the dropdown. Names are still listed — uncheck anyone who should not get this role.";
 if(n===1)paintStep1();else paintStep2();
 progress();
 window.scrollTo({top:0,behavior:"smooth"});
}
function paint(){if(step===1)paintStep1();else paintStep2();progress()}
function hideModal(){document.getElementById("modal").classList.remove("show")}
async function save(p){
 const r=await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"submit",draft:packDraft(),submittedAt:p.submittedAt,answers:p.answers})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.ok)throw new Error(j.message||"save failed");
 return true;
}
function boot(people){
 const map={};
 people.forEach(e=>{
  const label=e[2]||"(blank)";
  const key=norm(label);
  (map[key]||(map[key]={key,label,people:[]})).people.push(e);
 });
 DES=Object.values(map).sort((a,b)=>b.people.length-a.people.length||a.label.localeCompare(b.label));
 DES.forEach(d=>{d.people.sort((a,b)=>String(a[1]).localeCompare(String(b[1])));state[d.key]={access:null,drop:[],role:""}});
 document.getElementById("intro").textContent="First decide which KEKA designations need a login to Facility Management. Names are listed so you can see who they are. Uncheck a name if that person should not get a login.";
 document.getElementById("nav1").onclick=e=>{e.preventDefault();showStep(1)};
 document.getElementById("nav2").onclick=e=>{e.preventDefault();showStep(2)};
 document.getElementById("to2").onclick=()=>showStep(2);
 document.getElementById("back2").onclick=()=>showStep(1);
 document.getElementById("dl").hidden=false;document.getElementById("dl").onclick=download;
 document.getElementById("back").onclick=hideModal;
 document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")hideModal()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")hideModal()});
 document.getElementById("review").onclick=()=>{
  const yes=yesList();const missing=yes.filter(d=>!state[d.key].role);
  const body=document.getElementById("mbody");body.innerHTML="";
  const tb=el("table",{class:"grid"},el("tr",{},el("th",{},"KEKA designation"),el("th",{},"People"),el("th",{},"Portal role"),el("th",{},"Names")));
  yes.forEach(d=>{
   const names=peopleOf(d).map(p=>p[1]).join(", ");
   tb.append(el("tr",{},el("td",{},d.label),el("td",{},String(peopleOf(d).length)),el("td",{},state[d.key].role||"—"),el("td",{},names)));
  });
  const no=DES.filter(d=>state[d.key].access==="no");
  if(no.length)tb.append(el("tr",{},el("td",{},"No Facility login ("+no.length+" designations)"),el("td",{colspan:"3"},no.map(d=>d.label).join(", "))));
  body.append(tb);
  document.getElementById("msub").textContent=(missing.length?missing.length+" designation"+(missing.length>1?"s have":" has")+" no role yet. ":"")+"Designations with a login will get the portal role you picked. Are you sure you want to submit?";
  document.getElementById("modal").classList.add("show");document.getElementById("confirm").focus();
 };
 document.getElementById("confirm").onclick=async()=>{
  const p={submittedAt:new Date().toISOString(),answers:answers()};
  const btn=document.getElementById("confirm");btn.disabled=true;btn.textContent="Submitting…";
  let saved=false;try{saved=await save(p)}catch(e){saved=false}
  btn.disabled=false;btn.textContent="Yes, submit";hideModal();
  const box=document.getElementById("doneBox");box.innerHTML="";
  box.append(saved?el("div",{class:"done-msg"},"Submitted. Thank you. Your answers stay on this page. If you need to change anything, update them and they save again."):el("div",{class:"done-msg warn"},"Your answers could not be sent. Press Download answers and email the file to the project team."));
  window.scrollTo({top:0,behavior:"smooth"});
 };
 fetch(SAVE_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("load");return r.json()}).then(data=>{
  const remote=data&&data.draft;
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(remote&&Object.keys(remote).length)applyDraft(remote);
  else if(local&&local.draft)applyDraft(local.draft);
  ready=true;
  showStep(1);
  if(!(remote&&Object.keys(remote).length)&&local&&local.draft)persistNow();
 }).catch(()=>{
  try{const local=JSON.parse(localStorage.getItem(KEY)||"null");if(local&&local.draft)applyDraft(local.draft)}catch(e){}
  ready=true;showStep(1);
 });
}
fetch(PEOPLE_URL).then(r=>{if(!r.ok)throw new Error("people");return r.json()}).then(boot).catch(()=>{
  document.getElementById("step1").append(el("div",{class:"done-msg warn"},"Could not load the KEKA people list. Refresh the page."));
});
</script></body></html>
